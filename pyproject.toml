[tool.poetry]
name = "orgroamtools"
version = "0.1.5"
description = "Library to aid in analysis of org-roam collections"
authors = ["Aatmun Baxi <abaxi@tamu.edu>"]
readme = "README.org"
homepage = "https://aatmunbaxi.github.io/orgroamtools"

[tool.poetry.urls]
Issues = "https://github.com/aatmunbaxi/orgroamtools/issues"

[tool.poetry.dependencies]
python = "^3.10"
networkx = "^3.2.1"
orgparse = "^0.4.20231004"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["orgroamtools"]

[[tool.mypy.overrides]]
# No type information shipped
module = ["networkx", "networkx.*", "orgparse", "orgparse.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Long lines are mostly docstrings; leave line length to a formatter
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Temporary: moves to examples/ in tasks/05
"pretty_viz.py" = ["I001"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"